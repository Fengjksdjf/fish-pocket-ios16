name: device ipa

# Builds the app for a real device (unsigned) and uploads it as an IPA artifact.
# Same preparation as ios-build.yml, then a device compile instead of the simulator one.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app || sudo xcode-select -s /Applications/Xcode_27.app || true
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v4
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v4
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v4
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      - name: Compile (iOS device, unsigned)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find app/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry fish-pocket-device-unsigned.ipa Payload
          ls -lh fish-pocket-device-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: fish-pocket-ipa
          path: out/fish-pocket-device-unsigned.ipa
          retention-days: 14
